<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>T44 Aisle List — the shopping list sorts itself by aisle</title>
<link rel="stylesheet" href="_shared/nocturne.css">
<link rel="stylesheet" href="../style.css">
<style>
  /* the whole app screen from ../, in Nocturne type; no grid on the app screen */
  #stage{background:#07080C}
  #stage .ab{position:absolute;left:0;top:0;--font:var(--f-text)}
  body.autoplay #stage :focus-visible{outline:none}
  body.autoplay #li-cursor{transition:none}   /* visible from frame one */
  #li-cursor svg{transform:scale(1.5);transform-origin:4px 3px}   /* the hand stays readable in a phone-sized reel */
  #li-cursor.down svg{transform:scale(1.3)}
</style>
</head>
<body>
<div id="stage" data-title="T44 Aisle List" data-url="veraetogrex-portfolio.github.io/aisle-list">
  <section class="ab" aria-label="VECTOR Basket" data-assets="../assets/"></section>
</div>
<script src="_shared/stage.js"></script>
<script src="../script.js"></script>
<script>
const app = document.querySelector('.ab').aisleApp;
const at = sel => { const r = Stage.rect(document.querySelector(sel)); return [r.cx, r.cy]; };
const REST = [930, 760];
// one act: home → "Saturday shop" in the order it was added → "By aisle": the rows leave one by one for their aisle
Stage.init({
  reset: () => app.reset(),
  cursorStart: REST,
  async demo(s) {
    const t0 = performance.now();
    await s.until(t0, 750);                           // the whole home screen at rest first
    const [cx, cy] = at('[data-open]');
    await s.move([cx - 40, cy + 40], 450);            // onto the card title, the hand stays off the photos
    await s.until(t0, 1300);
    await s.click(null, { hold: 110 });               // → the list, 8 items in the order they were added
    await s.until(t0, 2200);
    const [ax, ay] = at('[data-mode="aisle"]');
    await s.move([ax + 18, ay + 6], 500);             // onto "By aisle", right half: the label stays readable
    await s.until(t0, 2850);
    await s.click(null, { hold: 120 });               // By aisle: three aisle headers, then the rows fly one by one (about 2.8 s)
    await s.move([1080, 870], 650);                   // off the list, below every close-up: the hand never covers the counter or the plan
    await s.until(t0, 9700);                          // 8 of 8 at 5.7 s: close-up of the counter, then of the store plan, then the whole screen
  },
});
</script>
</body>
</html>
